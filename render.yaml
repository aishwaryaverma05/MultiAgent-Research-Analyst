services:
  # FastAPI + Celery in one free web service
  - type: web
    name: multiagent-research-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c 'celery -A app.backend.celery_app:celery_app worker --loglevel=info --pool=solo & exec uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: DATABASE_URL
        fromDatabase:
          name: multiagent-research-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: multiagent-research-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"

  # Streamlit frontend
  - type: web
    name: multiagent-research-ui
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_BASE_URL
        sync: false

  # Free Redis-compatible Key Value
  - type: keyvalue
    name: multiagent-research-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: multiagent-research-db
    plan: free
    region: singapore
    databaseName: research_analyst
    user: research_analyst
