
[project]
name = "multi-agent-research-analyst"
version = "0.1.0"
description = "Production-oriented Multi-Agent Research Analyst"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
